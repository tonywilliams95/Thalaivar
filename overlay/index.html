<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; img-src 'self' file: data:; style-src 'self'; script-src 'self';">
<title>Thalaivar</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<div id="stage">
  <div id="character" class="offstage-left">
    <div id="bubble" class="hidden">
      <p id="line"></p>
      <div id="buttons">
        <button id="yes">YES</button>
        <button id="later">Remind me later</button>
      </div>
    </div>

    <div id="body">
      <img id="custom" alt="" hidden>

      <!-- Built-in cartoon Thalaivar: black shirt, white veshti, shades, water bottle -->
      <svg id="cartoon" viewBox="0 0 200 470" width="200" height="470" aria-label="Thalaivar">
        <ellipse cx="100" cy="462" rx="62" ry="7" fill="#000" opacity=".35"/>

        <!-- sandals -->
        <g id="footL" class="foot">
          <ellipse cx="80" cy="452" rx="17" ry="7" fill="#5a3a22"/>
          <ellipse cx="80" cy="448" rx="13" ry="6" fill="#a8714d"/>
          <path d="M70 447 Q80 441 90 447" stroke="#3b2414" stroke-width="3" fill="none"/>
        </g>
        <g id="footR" class="foot">
          <ellipse cx="120" cy="452" rx="17" ry="7" fill="#5a3a22"/>
          <ellipse cx="120" cy="448" rx="13" ry="6" fill="#a8714d"/>
          <path d="M110 447 Q120 441 130 447" stroke="#3b2414" stroke-width="3" fill="none"/>
        </g>

        <!-- veshti -->
        <g id="veshti">
          <path d="M57 252 L143 252 L151 446 L49 446 Z" fill="#f8f6ef" stroke="#e2dccb" stroke-width="1.5"/>
          <path d="M84 258 L80 440 M128 258 L134 440" stroke="#e7e2d3" stroke-width="2"/>
          <path d="M111 254 L117 445" stroke="#d6a52c" stroke-width="7"/>
          <rect x="49" y="438" width="102" height="7" fill="#d6a52c"/>
          <rect x="56" y="250" width="88" height="8" rx="3" fill="#ece7d8"/>
        </g>

        <!-- shirt -->
        <path d="M60 130 Q100 118 140 130 L147 262 L53 262 Z" fill="#141414"/>
        <path d="M100 126 L100 260" stroke="#2c2c2c" stroke-width="3"/>
        <circle cx="104" cy="150" r="2" fill="#3a3a3a"/>
        <circle cx="104" cy="180" r="2" fill="#3a3a3a"/>
        <circle cx="104" cy="210" r="2" fill="#3a3a3a"/>
        <path d="M86 122 L100 146 L92 124 Z M114 122 L100 146 L108 124 Z" fill="#262626"/>

        <!-- arms with rolled sleeves, hands meeting at the bottle -->
        <path d="M60 132 Q44 150 44 205 L62 207 Q64 170 70 150 Z" fill="#141414"/>
        <path d="M140 132 Q156 150 156 205 L138 207 Q136 170 130 150 Z" fill="#141414"/>
        <path d="M46 200 Q50 238 92 244 L94 232 Q66 226 62 202 Z" fill="#a8714d"/>
        <path d="M154 200 Q150 238 108 244 L106 232 Q134 226 138 202 Z" fill="#a8714d"/>
        <rect x="132" y="216" width="10" height="7" rx="2" fill="#c9c9c9" transform="rotate(-35 137 219)"/>

        <!-- water bottle -->
        <g id="bottle">
          <rect x="92" y="208" width="16" height="50" rx="5" fill="#cfeaff" opacity=".9"/>
          <rect x="92" y="226" width="16" height="12" fill="#2b8be0"/>
          <rect x="95" y="200" width="10" height="9" rx="2" fill="#1f6fc0"/>
          <rect x="95" y="212" width="3" height="40" rx="1.5" fill="#fff" opacity=".7"/>
        </g>
        <ellipse cx="92" cy="240" rx="8" ry="7" fill="#9c6745"/>
        <ellipse cx="108" cy="240" rx="8" ry="7" fill="#9c6745"/>

        <!-- neck and head -->
        <rect x="89" y="98" width="22" height="28" fill="#9c6745"/>
        <ellipse cx="70" cy="74" rx="5" ry="9" fill="#9c6745"/>
        <ellipse cx="130" cy="74" rx="5" ry="9" fill="#9c6745"/>
        <ellipse cx="100" cy="72" rx="30" ry="36" fill="#a8714d"/>

        <!-- salt-and-pepper hair, swept back -->
        <path d="M69 66 Q66 30 100 27 Q134 30 131 66 Q128 46 112 42 Q100 40 88 42 Q72 46 69 66 Z" fill="#2f2f2f"/>
        <path d="M80 38 Q100 30 122 38" stroke="#9a9a9a" stroke-width="2.5" fill="none"/>
        <path d="M76 46 Q98 36 126 46" stroke="#7d7d7d" stroke-width="2" fill="none"/>

        <!-- beard and moustache -->
        <path d="M72 76 Q74 104 100 112 Q126 104 128 76 Q124 92 112 94 Q100 98 88 94 Q76 92 72 76 Z" fill="#4c4c4c"/>
        <path d="M86 90 Q100 84 114 90 Q100 94 86 90 Z" fill="#3a3a3a"/>
        <path d="M80 98 l2 2 M94 104 l2 2 M108 102 l2 2 M118 96 l2 2" stroke="#b5b5b5" stroke-width="1.5"/>
        <path d="M93 97 Q100 101 107 97" stroke="#6b3b2a" stroke-width="2" fill="none"/>

        <!-- shades -->
        <g id="shades">
          <rect x="74" y="60" width="23" height="15" rx="5" fill="#0a0a0a"/>
          <rect x="103" y="60" width="23" height="15" rx="5" fill="#0a0a0a"/>
          <path d="M97 65 L103 65 M74 64 L69 62 M126 64 L131 62" stroke="#0a0a0a" stroke-width="2.5"/>
          <path d="M78 63 L84 63 M107 63 L113 63" stroke="#fff" stroke-width="1.5" opacity=".5"/>
        </g>
      </svg>
    </div>
  </div>
</div>
<script src="overlay.js"></script>
</body>
</html>
